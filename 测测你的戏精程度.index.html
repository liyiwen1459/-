<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>测测你的戏精人格 | 话剧队招新专属</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f0faf5;
    color: #2d4a3e;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow-x: hidden;
  }
  #app {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    position: relative;
    overflow: hidden;
  }

  /* ===== 通用页面 ===== */
  .page {
    display: none;
    flex-direction: column;
    min-height: 100vh;
    padding: 32px 24px 40px;
    animation: fadeIn 0.45s ease;
    position: relative;
    z-index: 1;
  }
  .page.active { display: flex; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== 背景装饰 ===== */
  .bg-blob {
    position: fixed;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
    animation: blobFloat 8s ease-in-out infinite;
  }
  .blob-1 { width: 260px; height: 260px; top: -70px; left: -80px; background: #a8e6cf; }
  .blob-2 { width: 220px; height: 220px; bottom: 10%; right: -70px; background: #ffd3b6; animation-delay: -3s; }
  .blob-3 { width: 180px; height: 180px; top: 45%; left: -60px; background: #d4c5f9; animation-delay: -5s; }
  @keyframes blobFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(15px, -20px) scale(1.08); }
    66% { transform: translate(-10px, 10px) scale(0.95); }
  }

  /* ===== 漂浮小图标（话剧主题，不重复） ===== */
  .float-icon {
    position: fixed;
    font-size: 20px;
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
    animation: floatUpDown 6s ease-in-out infinite;
    filter: drop-shadow(0 2px 6px rgba(78, 205, 164, 0.15));
  }
  @keyframes floatUpDown {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-20px) rotate(10deg); }
  }

  /* ===== 封面页 ===== */
  #page-cover {
    justify-content: center;
    align-items: center;
    text-align: center;
  }
  .cover-mask {
    font-size: 80px;
    margin-bottom: 20px;
    animation: maskBounce 2.5s ease-in-out infinite;
    filter: drop-shadow(0 8px 20px rgba(168, 230, 207, 0.5));
  }
  @keyframes maskBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-12px) scale(1.05); }
  }
  .cover-title {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #2d8a6e, #4ecda4, #6bcf9a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 14px;
    animation: titleGlow 3s ease-in-out infinite;
  }
  @keyframes titleGlow {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(78, 205, 164, 0.3)); }
    50% { filter: drop-shadow(0 0 18px rgba(78, 205, 164, 0.6)); }
  }
  .cover-sub {
    font-size: 14px;
    color: #6b9a8a;
    margin-bottom: 10px;
    letter-spacing: 2px;
  }
  .cover-desc {
    font-size: 13px;
    color: #8aab9e;
    line-height: 1.9;
    margin-bottom: 44px;
    max-width: 300px;
  }
  .btn-start {
    display: inline-block;
    padding: 17px 60px;
    border-radius: 50px;
    border: none;
    background: linear-gradient(135deg, #4ecda4, #38b88a);
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 3px;
    cursor: pointer;
    box-shadow: 0 10px 32px rgba(78, 205, 164, 0.35);
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative;
    overflow: hidden;
    animation: btnPulse 2.5s ease-in-out infinite;
  }
  @keyframes btnPulse {
    0%, 100% { box-shadow: 0 10px 32px rgba(78, 205, 164, 0.35); }
    50% { box-shadow: 0 10px 42px rgba(78, 205, 164, 0.6); }
  }
  .btn-start::after {
    content: '';
    position: absolute;
    top: -50%; left: -60%;
    width: 40%; height: 200%;
    background: rgba(255,255,255,0.3);
    transform: rotate(25deg);
    animation: shine 3s ease-in-out infinite;
  }
  @keyframes shine {
    0% { left: -60%; }
    50%, 100% { left: 130%; }
  }
  .btn-start:active { transform: scale(0.95); }

  /* ===== 答题页 ===== */
  #page-quiz { justify-content: flex-start; }
  .quiz-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .quiz-progress-text { font-size: 13px; color: #8aab9e; }
  .quiz-progress-text span { color: #38b88a; font-weight: 700; font-size: 17px; }
  .progress-bar {
    width: 100%;
    height: 6px;
    background: #ddf0e8;
    border-radius: 6px;
    margin-bottom: 30px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #4ecda4, #6bcf9a, #a8e6cf);
    border-radius: 6px;
    transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    width: 0%;
  }
  .question-text {
    font-size: 19px;
    font-weight: 700;
    line-height: 1.65;
    margin-bottom: 28px;
    color: #2d4a3e;
    min-height: 60px;
    animation: slideInQ 0.35s ease;
  }
  @keyframes slideInQ {
    from { opacity: 0; transform: translateX(20px); }
    to { opacity: 1; transform: translateX(0); }
  }
  .options { display: flex; flex-direction: column; gap: 13px; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 13px;
    padding: 17px 18px;
    background: #ffffff;
    border: 2px solid #e4f2ec;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.25s ease;
    text-align: left;
    font-size: 15px;
    line-height: 1.55;
    color: #3d5a4e;
    box-shadow: 0 3px 12px rgba(78, 205, 164, 0.06);
    animation: optionIn 0.35s ease backwards;
  }
  .option:nth-child(1) { animation-delay: 0.03s; }
  .option:nth-child(2) { animation-delay: 0.08s; }
  .option:nth-child(3) { animation-delay: 0.13s; }
  .option:nth-child(4) { animation-delay: 0.18s; }
  @keyframes optionIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .option:active { transform: scale(0.98); }
  .option.selected {
    border-color: #4ecda4;
    background: #eafaf3;
    box-shadow: 0 0 24px rgba(78, 205, 164, 0.2);
    transform: scale(1.01);
  }
  .option-tag {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: #e4f2ec;
    color: #6b9a8a;
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s;
    margin-top: 1px;
  }
  .option.selected .option-tag {
    background: linear-gradient(135deg, #4ecda4, #38b88a);
    color: #fff;
    transform: scale(1.1);
  }

  /* ===== 结果页 ===== */
  #page-result {
    justify-content: flex-start;
    align-items: center;
    text-align: center;
    overflow: hidden;
  }
  .result-badge {
    font-size: 12px;
    color: #8aab9e;
    letter-spacing: 4px;
    margin-bottom: 16px;
    margin-top: 10px;
    animation: fadeInDown 0.5s ease backwards;
  }
  @keyframes fadeInDown {
    from { opacity: 0; transform: translateY(-14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Emoji 大动画 */
  .result-emoji-wrap {
    position: relative;
    width: 120px;
    height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    animation: emojiDrop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
  }
  @keyframes emojiDrop {
    0% { opacity: 0; transform: translateY(-60px) scale(0.3) rotate(-20deg); }
    60% { opacity: 1; transform: translateY(8px) scale(1.1) rotate(5deg); }
    100% { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
  }
  .result-emoji {
    font-size: 76px;
    animation: emojiFloat 3s ease-in-out infinite;
    filter: drop-shadow(0 10px 24px rgba(78, 205, 164, 0.3));
    position: relative;
    z-index: 2;
  }
  @keyframes emojiFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-8px) rotate(3deg); }
    75% { transform: translateY(-4px) rotate(-3deg); }
  }
  .emoji-ring {
    position: absolute;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    border: 3px dashed #a8e6cf;
    animation: ringSpin 8s linear infinite;
    opacity: 0.7;
  }
  .emoji-ring-2 {
    position: absolute;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    border: 2px dotted #ffd3b6;
    animation: ringSpinReverse 10s linear infinite;
    opacity: 0.5;
  }
  @keyframes ringSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  @keyframes ringSpinReverse {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
  }
  .sparkle {
    position: absolute;
    font-size: 16px;
    animation: sparkleAnim 2s ease-in-out infinite;
    z-index: 3;
  }
  .sparkle-1 { top: 5px; right: 10px; animation-delay: 0s; }
  .sparkle-2 { bottom: 10px; left: 5px; animation-delay: 0.6s; }
  .sparkle-3 { top: 50%; right: -8px; animation-delay: 1.2s; }
  @keyframes sparkleAnim {
    0%, 100% { opacity: 0; transform: scale(0.5) rotate(0deg); }
    50% { opacity: 1; transform: scale(1.2) rotate(180deg); }
  }

  .result-title {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 1px;
    background: linear-gradient(135deg, #2d8a6e, #4ecda4, #6bcf9a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 22px;
    line-height: 1.45;
    padding: 0 10px;
    animation: titlePop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s backwards;
  }
  @keyframes titlePop {
    0% { opacity: 0; transform: scale(0.7); }
    100% { opacity: 1; transform: scale(1); }
  }
  .result-desc {
    font-size: 15px;
    line-height: 1.95;
    color: #4a6b5e;
    margin-bottom: 26px;
    padding: 0 8px;
    text-align: left;
    animation: fadeSlideUp 0.6s ease 0.5s backwards;
  }
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .result-box {
    width: 100%;
    background: #ffffff;
    border: 2px solid #e4f2ec;
    border-radius: 18px;
    padding: 20px 22px;
    margin-bottom: 16px;
    text-align: left;
    box-shadow: 0 4px 18px rgba(78, 205, 164, 0.08);
    animation: fadeSlideUp 0.6s ease 0.7s backwards;
    position: relative;
    overflow: hidden;
  }
  .result-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px; height: 100%;
    background: linear-gradient(180deg, #4ecda4, #a8e6cf);
    border-radius: 4px 0 0 4px;
  }
  .result-box-label {
    font-size: 11px;
    color: #8aab9e;
    letter-spacing: 3px;
    margin-bottom: 8px;
  }
  .result-box-content {
    font-size: 16px;
    color: #2d8a6e;
    font-weight: 700;
    line-height: 1.6;
  }
  .result-action {
    width: 100%;
    background: linear-gradient(135deg, #eafaf3, #f0fdf8);
    border: 2px dashed #4ecda4;
    border-radius: 18px;
    padding: 20px 22px;
    margin-bottom: 26px;
    font-size: 15px;
    line-height: 1.7;
    color: #2d4a3e;
    text-align: left;
    animation: fadeSlideUp 0.6s ease 0.9s backwards, actionGlow 2.5s ease-in-out 1.5s infinite;
  }
  @keyframes actionGlow {
    0%, 100% { box-shadow: 0 0 0 rgba(78, 205, 164, 0); }
    50% { box-shadow: 0 0 24px rgba(78, 205, 164, 0.2); }
  }
  .result-action strong { color: #2d8a6e; }
  .result-footer {
    font-size: 13px;
    color: #8aab9e;
    line-height: 1.8;
    margin-bottom: 22px;
    animation: fadeSlideUp 0.6s ease 1.1s backwards;
  }
  .btn-restart {
    display: inline-block;
    padding: 15px 48px;
    border-radius: 50px;
    border: 2px solid #a8e6cf;
    background: #ffffff;
    color: #38b88a;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.25s;
    animation: fadeSlideUp 0.6s ease 1.2s backwards;
    box-shadow: 0 4px 16px rgba(78, 205, 164, 0.12);
  }
  .btn-restart:active { background: #eafaf3; transform: scale(0.96); }

  /* 彩带粒子 */
  .confetti {
    position: absolute;
    width: 8px;
    height: 14px;
    border-radius: 2px;
    top: -20px;
    animation: confettiFall linear forwards;
    z-index: 5;
    pointer-events: none;
  }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }

  /* 结果页顶部彩带条 */
  .result-ribbon {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 6px;
    background: linear-gradient(90deg, #4ecda4, #ffd3b6, #d4c5f9, #a8e6cf, #4ecda4);
    background-size: 200% 100%;
    animation: ribbonSlide 3s linear infinite;
    z-index: 10;
  }
  @keyframes ribbonSlide {
    0% { background-position: 0% 0; }
    100% { background-position: 200% 0; }
  }
</style>
</head>
<body>

<!-- 背景装饰 -->
<div class="bg-blob blob-1"></div>
<div class="bg-blob blob-2"></div>
<div class="bg-blob blob-3"></div>

<!-- 话剧主题漂浮小图标（不重复） -->
<div class="float-icon" style="top:8%; right:12%;">🎭</div>
<div class="float-icon" style="top:22%; left:8%; animation-delay:-1s;">🎬</div>
<div class="float-icon" style="top:38%; right:6%; animation-delay:-2s;">🎟️</div>
<div class="float-icon" style="top:52%; left:12%; animation-delay:-3s;">🎪</div>
<div class="float-icon" style="top:68%; right:10%; animation-delay:-4s;">🎤</div>
<div class="float-icon" style="top:82%; left:6%; animation-delay:-5s;">📜</div>
<div class="float-icon" style="top:15%; left:45%; animation-delay:-2.5s;">🎩</div>
<div class="float-icon" style="top:75%; right:45%; animation-delay:-3.5s;">👏</div>

<div id="app">

  <!-- 封面页 -->
  <div class="page active" id="page-cover">
    <div class="cover-mask">🎭</div>
    <div class="cover-title">测测你的戏精人格</div>
    <div class="cover-sub">话剧队招新专属测试</div>
    <div class="cover-desc">
      18道题，1分钟<br>
      看看你身体里住着哪个戏精<br>
      凭结果截图到招新摊位<br>
      可领专属「戏精证」一份
    </div>
    <button class="btn-start" onclick="startQuiz()">开始测试</button>
  </div>

  <!-- 答题页 -->
  <div class="page" id="page-quiz">
    <div class="quiz-header">
      <div class="quiz-progress-text">第 <span id="q-current">1</span> / <span id="q-total">18</span> 题</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="question-text" id="question-text"></div>
    <div class="options" id="options"></div>
  </div>

  <!-- 结果页 -->
  <div class="page" id="page-result">
    <div class="result-ribbon"></div>
    <div class="result-badge">你 的 戏 精 人 格 是</div>

    <div class="result-emoji-wrap">
      <div class="emoji-ring"></div>
      <div class="emoji-ring-2"></div>
      <div class="sparkle sparkle-1">✨</div>
      <div class="sparkle sparkle-2">⭐</div>
      <div class="sparkle sparkle-3">💫</div>
      <div class="result-emoji" id="result-emoji"></div>
    </div>

    <div class="result-title" id="result-title"></div>
    <div class="result-desc" id="result-desc"></div>
    <div class="result-box">
      <div class="result-box-label">适 合 岗 位</div>
      <div class="result-box-content" id="result-role"></div>
    </div>
    <div class="result-action" id="result-action"></div>
    <div class="result-footer">凭结果截图到招新摊位<br>领取专属「戏精证」一份</div>
    <button class="btn-restart" onclick="restartQuiz()">再测一次</button>
  </div>

</div>

<script>
/* ============================================================
   类型常量
   ============================================================ */
const TYPE = {
  STAGE:    'stage',
  SCRIPT:   'script',
  IMPROV:   'improv',
  VOICE:    'voice',
  GIGGLER:  'giggler',
  NERVOUS:  'nervous',
  BACKSTAGE:'backstage',
  OBSERVER: 'observer'
};

/* ============================================================
   题库
   ============================================================ */
const QUESTIONS = [
  {
    q: '你第一次走进排练室，最可能发生什么？',
    options: [
      { text: '直接走到中间，感受一下站在舞台上的感觉', type: TYPE.STAGE },
      { text: '先找个角落坐下，观察大家的互动和站位', type: TYPE.OBSERVER },
      { text: '随便找个位置坐下，很快和旁边的人聊起来', type: TYPE.IMPROV },
      { text: '站在门口犹豫一下，然后选一个离门最近的位置', type: TYPE.NERVOUS }
    ]
  },
  {
    q: '拿到剧本后，你第一件事是？',
    options: [
      { text: '翻到自己角色的所有台词，开始默念', type: TYPE.STAGE },
      { text: '把整个剧本读完，思考结局或人物动机', type: TYPE.SCRIPT },
      { text: '先看对手角色的台词，想想怎么接戏', type: TYPE.IMPROV },
      { text: '数一数自己有几句话，然后深呼吸', type: TYPE.NERVOUS }
    ]
  },
  {
    q: '排练时导演突然说“这段即兴来一版”，你的反应是？',
    options: [
      { text: '立刻开始尝试，享受自由发挥', type: TYPE.IMPROV },
      { text: '脑子里开始编一个新的情节或结局', type: TYPE.SCRIPT },
      { text: '先看别人怎么演，再跟着做', type: TYPE.NERVOUS },
      { text: '思考这句话用什么样的声音和语调更合适', type: TYPE.VOICE }
    ]
  },
  {
    q: '你在排练时忘词了，第一反应是？',
    options: [
      { text: '面不改色地编一句，假装是导演新改的', type: TYPE.SCRIPT },
      { text: '用动作拖延时间，等对手提醒', type: TYPE.IMPROV },
      { text: '直接笑场，说“对不起再来一遍”', type: TYPE.GIGGLER },
      { text: '愣住，大脑空白，然后看向导演', type: TYPE.NERVOUS }
    ]
  },
  {
    q: '如果让你给角色设计一个标志性动作，你会选？',
    options: [
      { text: '一个能展现角色内心挣扎的肢体动作', type: TYPE.STAGE },
      { text: '一个和台词形成反差的微表情', type: TYPE.SCRIPT },
      { text: '一个能根据观众反应调整的互动动作', type: TYPE.IMPROV },
      { text: '一个配合特定音效的声音处理', type: TYPE.VOICE }
    ]
  },
  {
    q: '排练休息时，你通常在做什么？',
    options: [
      { text: '对着镜子练习刚刚那段的情绪', type: TYPE.STAGE },
      { text: '翻剧本，想下一场怎么改', type: TYPE.SCRIPT },
      { text: '和旁边的人聊天，顺便把刚学的梗用上', type: TYPE.GIGGLER },
      { text: '找个安静的地方喝水，恢复能量', type: TYPE.NERVOUS }
    ]
  },
  {
    q: '演出当天，你站在侧台等上场，心里在想什么？',
    options: [

/* ============================================================
   状态
   ============================================================ */
let currentIndex = 0;
let scores = {};

function initScores() {
  scores = {};
  Object.values(TYPE).forEach(t => { scores[t] = 0; });
}

function startQuiz() {
  currentIndex = 0;
  initScores();
  document.getElementById('q-total').textContent = QUESTIONS.length;
  showPage('page-quiz');
  renderQuestion();
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function renderQuestion() {
  const q = QUESTIONS[currentIndex];
  document.getElementById('q-current').textContent = currentIndex + 1;
  document.getElementById('progress-fill').style.width = ((currentIndex) / QUESTIONS.length * 100) + '%';
  document.getElementById('question-text').textContent = q.q;

  const container = document.getElementById('options');
  container.innerHTML = '';
  const tags = ['A', 'B', 'C', 'D'];

  q.options.forEach((opt, i) => {
    const btn = document.createElement('div');
    btn.className = 'option';
    btn.innerHTML = `<div class="option-tag">${tags[i]}</div><div>${opt.text}</div>`;
    btn.onclick = () => selectOption(opt.type);
    container.appendChild(btn);
  });
}

function selectOption(type) {
  const options = document.querySelectorAll('.option');
  options.forEach(o => o.classList.remove('selected'));
  event.currentTarget.classList.add('selected');

  scores[type] = (scores[type] || 0) + 1;

  setTimeout(() => {
    currentIndex++;
    if (currentIndex < QUESTIONS.length) {
      renderQuestion();
    } else {
      document.getElementById('progress-fill').style.width = '100%';
      setTimeout(showResult, 350);
    }
  }, 320);
}

/* ============================================================
   结果页 + 动画
   ============================================================ */
function showResult() {
  let maxType = null;
  let maxScore = -1;
  Object.keys(scores).forEach(t => {
    if (scores[t] > maxScore) {
      maxScore = scores[t];
      maxType = t;
    }
  });

  const result = RESULTS[maxType];
  document.getElementById('result-emoji').textContent = result.emoji;
  document.getElementById('result-title').textContent = result.title;
  document.getElementById('result-desc').textContent = result.desc;
  document.getElementById('result-role').textContent = result.role;
  document.getElementById('result-action').innerHTML = result.action;

  showPage('page-result');

  setTimeout(() => launchConfetti(), 600);
}

/* 彩带粒子 */
function launchConfetti() {
  const colors = ['#4ecda4', '#ffd3b6', '#d4c5f9', '#a8e6cf', '#6bcf9a', '#f9e2ae', '#f7b7a3'];
  const count = 40;

  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const confetti = document.createElement('div');
      confetti.className = 'confetti';
      confetti.style.left = Math.random() * 100 + '%';
      confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
      confetti.style.animationDuration = (Math.random() * 1.5 + 2) + 's';
      confetti.style.animationDelay = (Math.random() * 0.3) + 's';
      confetti.style.width = (Math.random() * 6 + 5) + 'px';
      confetti.style.height = (Math.random() * 8 + 8) + 'px';
      confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';

      document.getElementById('page-result').appendChild(confetti);

      setTimeout(() => confetti.remove(), 4000);
    }, i * 50);
  }
}

function restartQuiz() {
  startQuiz();
}
